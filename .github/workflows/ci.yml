name: CI

on:
  pull_request:
    branches: [main]
  # Also on main so the badge and the cache reflect the merged state. A push
  # build warms the npm cache that the next pull request restores from.
  push:
    branches: [main]

# A second push to the same pull request cancels the first. Nothing is
# deployed from here, so a superseded run has no value.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node in Dockerfile.dev and on the server.
          node-version: '24'
          # Keys off package-lock.json, so the cache is reused until a
          # dependency actually changes.
          cache: npm

      # ci, not install: it installs exactly the lockfile and fails if
      # package.json and the lockfile disagree.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # svelte-check, which typechecks .svelte files as well as .ts. Plain
      # tsc would skip the components entirely.
      - name: Typecheck
        run: npm run check

  test:
    name: Test
    runs-on: ubuntu-latest

    # A separate job from lint so the two failure modes are distinguishable
    # in the checks list without opening the logs.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs both projects: 'server' for plain TypeScript, 'client' in
      # jsdom for the components.
      - name: Run tests with coverage
        run: npm run test:coverage

      # Reported, not gated. There is no coverage threshold on purpose:
      # a number set this early gets satisfied rather than earned.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14
